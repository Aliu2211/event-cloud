name: Event Ticketing Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest boto3 moto
      - name: Run tests
        run: pytest tests/ -v

  deploy:
    name: Package and Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package Lambda functions
        run: bash scripts/package_lambdas.sh
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure
      - name: Terraform Plan
        run: terraform plan -var="state_bucket_name=${{ secrets.TF_STATE_BUCKET }}"
        working-directory: infrastructure
      - name: Terraform Apply
        run: terraform apply -auto-approve -var="state_bucket_name=${{ secrets.TF_STATE_BUCKET }}"
        working-directory: infrastructure
